<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Group Assistant</title>
<style>
  :root {
    --bg: #0e1116; --fg: #e9edf2; --muted: #8a94a3; --accent: #6cb6ff;
    --hand: #f2c14e; --hand-bg: #2a2410; --contra: #ff7b72; --gap: #6cb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; padding: 3vh 4vw; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 2vw; }
  .name { font-size: 2.2vw; font-weight: 600; letter-spacing: .02em; }
  .name span { color: var(--muted); font-weight: 400; }
  #hand { display: none; align-items: center; gap: 1.2vw; padding: 1vh 1.6vw; border-radius: 999px;
    background: var(--hand-bg); border: 2px solid var(--hand); color: var(--hand); font-size: 2vw; }
  #hand.on { display: flex; animation: pulse 2s ease-in-out infinite; }
  #hand .type { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  #hand.contradiction .type { color: var(--contra); }
  #hand.gap .type { color: var(--gap); }
  #hand.point .type { color: #7ee787; }
  #hand button { font: inherit; font-size: 1.3vw; padding: .5vh 1.1vw; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--hand); background: transparent; color: var(--fg); }
  #hand button:hover { background: #3a3218; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .6vw rgba(242,193,78,.15); } }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  #label { color: var(--muted); font-size: 1.6vw; margin-bottom: 2vh; }
  #question { color: var(--muted); font-size: 2vw; font-style: italic; margin-bottom: 2.5vh; }
  #answer { font-size: 3.6vw; line-height: 1.35; max-width: 85vw; overflow: hidden; }
  #answer.interjection { border-left: .5vw solid var(--hand); padding-left: 2vw; }
  #answer.idle { color: var(--muted); font-size: 2.4vw; }
  footer { display: flex; gap: 2.5vw; color: var(--muted); font-size: 1.2vw; }
  .dot { display: inline-block; width: .8vw; height: .8vw; border-radius: 50%; background: #555; margin-right: .5vw; }
  .dot.on { background: #3fb950; }
  .dot.warn { background: #f85149; }
  .warn-text { color: #f85149; }
  kbd { border: 1px solid #444; border-radius: 4px; padding: 0 .4vw; }
  #hand .icon { font-size: 2.2vw; }
  #hand.point .type { color: #7ee787; }
  #tbtn { font: inherit; color: var(--muted); background: transparent; border: 1px solid #333;
    border-radius: 999px; padding: .1vh .9vw; cursor: pointer; }
  #transcript { display: none; max-height: 26vh; overflow-y: auto; margin-top: 1.5vh; padding: 1vh 1.2vw;
    border-top: 1px solid #222; font-size: 1.3vw; line-height: 1.45; color: #b8c0cc; }
  #transcript.open { display: block; }
  #transcript .ts { color: var(--muted); margin-right: .6vw; font-variant-numeric: tabular-nums; }
  #transcript .me { color: var(--accent); }
  @media (max-width: 700px) {
    body { padding: 16px; }
    .name { font-size: 20px; } #hand { font-size: 16px; } #hand button { font-size: 14px; }
    #answer { font-size: 24px; } #question, #label { font-size: 16px; } footer { font-size: 12px; flex-wrap: wrap; }
    #hand .icon { font-size: 18px; } #transcript { font-size: 13px; max-height: 35vh; }
  }
</style>
</head>
<body>
<header>
  <div class="name" id="name">Sherlock <span>· reading group assistant</span></div>
  <div id="hand" aria-live="polite">
    <span class="icon" id="hand-icon">✋</span><span class="type" id="hand-type"></span><span id="hand-count"></span>
    <button id="reveal" title="R">Call on Sherlock</button><button id="dismiss" title="D">Dismiss</button>
  </div>
</header>
<main>
  <div id="label"></div>
  <div id="question"></div>
  <div id="answer" class="idle">Waiting for a question…</div>
  <section id="transcript" aria-label="Live transcript"></section>
</main>
<footer>
  <span><span class="dot" id="dot"></span><span id="listening">connecting</span></span>
  <span id="mode">mode: –</span>
  <span id="latency">last answer: –</span>
  <span id="models"></span>
  <span><kbd>R</kbd> call on · <kbd>D</kbd> dismiss · <kbd>S</kbd> stop speaking · <kbd>T</kbd> transcript</span>
  <button id="tbtn" style="display:none">Transcript ▸</button>
</footer>
<script>
const $ = id => document.getElementById(id);
let ws, answerId = null;
// how each kind of raised hand is shown
const HANDS = {
  contradiction: {icon: "⚠️", label: "Correction"},
  gap: {icon: "❓", label: "Unanswered question"},
  point: {icon: "🙋", label: "Point"},
};
const handLook = t => HANDS[t] || {icon: "✋", label: t || ""};
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

// live transcript panel (closed by default; remembered per browser)
let transcriptOpen = false;
try { transcriptOpen = localStorage.getItem("rga.transcript") === "open"; } catch (e) {}
if (new URLSearchParams(location.search).has("transcript")) transcriptOpen = true;   // ?transcript=1
function setTranscriptOpen(open) {
  transcriptOpen = open;
  $("transcript").className = open ? "open" : "";
  $("tbtn").textContent = open ? "Transcript ▾" : "Transcript ▸";
  try { localStorage.setItem("rga.transcript", open ? "open" : "closed"); } catch (e) {}
  if (open) $("transcript").scrollTop = $("transcript").scrollHeight;
}
function addLine(seg) {
  const box = $("transcript");
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const div = document.createElement("div");
  if (seg.speaker) div.className = "me";
  const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = fmt(seg.start);
  div.append(ts, document.createTextNode((seg.speaker ? seg.speaker + ": " : "") + seg.text));
  box.appendChild(div);
  while (box.childElementCount > 80) box.removeChild(box.firstChild);
  if (atEnd) box.scrollTop = box.scrollHeight;
}

function connect() {
  // keep the share key (?k=...) from the page URL; wss when opened through an https tunnel
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws${location.search}`);
  ws.onopen = () => { $("listening").textContent = "connected"; };
  ws.onclose = () => { $("dot").className = "dot"; $("listening").textContent = "disconnected, retrying"; setTimeout(connect, 1500); };
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}

function setAnswer(text, cls) {
  const a = $("answer");
  a.className = cls || "";
  a.textContent = text;
}

function handle(m) {
  switch (m.type) {
    case "status":
      const silent = m.listening && m.audio_ok === false;
      $("dot").className = "dot" + (silent ? " warn" : m.listening ? " on" : "");
      $("listening").className = silent ? "warn-text" : "";
      $("listening").textContent = !m.listening ? "not listening"
        : silent ? `no audio from ${m.device || "input"}: check Zoom speaker`
        : `listening (${m.source})` + (m.heard ? ` · ${m.heard} lines heard` : "");
      $("mode").textContent = "mode: " + m.mode;
      if (m.name) $("name").firstChild.textContent = m.name + " ";
      if (m.latency_s != null) $("latency").textContent = `last answer: ${m.latency_s.toFixed(1)} s`;
      if (m.models) $("models").textContent =
        `answers: ${m.models.answer}` + (m.mode !== "ask" ? ` · hands: ${m.models.trigger}` : "");
      break;
    case "answer_start":
      answerId = m.id; $("label").textContent = "Answer";
      $("question").textContent = m.question ? `“${m.question}”` : "";
      setAnswer(m.text || "…");
      break;
    case "answer_delta":
      if (m.id !== answerId) break;
      if ($("answer").textContent === "…") $("answer").textContent = "";
      $("answer").textContent += m.text;
      break;
    case "answer_done":
      answerId = m.id; $("label").textContent = "Answer";
      if (m.question !== undefined) $("question").textContent = m.question ? `“${m.question}”` : "";
      setAnswer(m.text);
      if (m.latency_s != null) $("latency").textContent = `last answer: ${m.latency_s.toFixed(1)} s`;
      break;
    case "hand_raised":
    case "hand_cleared": {
      const h = $("hand");
      handId = m.count > 0 ? m.id : null;
      if (m.count > 0) {
        h.className = "on " + (m.trigger || "");
        $("hand-icon").textContent = handLook(m.trigger).icon;
        $("hand-type").textContent = handLook(m.trigger).label;
        $("hand-count").textContent = m.count > 1 ? `(${m.count})` : "";
      } else { h.className = ""; }
      break;
    }
    case "hand_revealed": {
      $("label").textContent = `${handLook(m.trigger).icon} Sherlock · ${handLook(m.trigger).label.toLowerCase()}`;
      // say what the hand responds to: the conversation may have moved on since
      const when = m.quote_t != null ? ` (${fmt(m.quote_t)})` : "";
      $("question").textContent = m.quote ? `Re: “${m.quote}”${when}` : "";
      setAnswer(m.text, "interjection");
      break;
    }
    case "transcript": {            // {lines: [...]} on connect, then one line per message
      $("tbtn").style.display = "";
      if (m.reset) $("transcript").textContent = "";
      for (const seg of m.lines || []) addLine(seg);
      break;
    }
    case "transcript_off":
      $("transcript").textContent = ""; $("tbtn").style.display = "none"; setTranscriptOpen(false);
      break;
  }
}

// name the hand being acted on, so two people pressing Reveal at once can't reveal two hands
let handId = null;
function act(action) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({action, id: handId})); }
$("reveal").onclick = () => act("reveal");
$("dismiss").onclick = () => act("dismiss");
$("tbtn").onclick = () => setTranscriptOpen(!transcriptOpen);
setTranscriptOpen(transcriptOpen);
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "r" || e.key === "R") act("reveal");
  if (e.key === "d" || e.key === "D") act("dismiss");
  if (e.key === "s" || e.key === "S") act("stop_speaking");
  if ((e.key === "t" || e.key === "T") && $("tbtn").style.display !== "none") setTranscriptOpen(!transcriptOpen);
});
connect();
</script>
</body>
</html>
