# The full setup: discuss mode, every role on the Nexus GPU with the whole paper in
# context, and spoken answers and raised hands. Start the GPU first (scripts/nexus_up.sh).
#   python -m assistant --paper papers/<paper>.pdf --profile nexus
# If Nexus is unreachable, each role falls through to Groq, then the local model, within
# seconds (Groq and local use retrieved excerpts instead of the whole paper).

mode: discuss               # ask + corrections/unanswered questions + points to add

stt:
  backend: parakeet-mlx     # Apple GPU: ~0.9 s per utterance vs ~2.8 s for Whisper on the CPU

voice:
  mode: answers+reveal      # speak direct answers, and any hand when it is revealed
  output_device: "BlackHole 16ch"   # Zoom's microphone

trigger:
  # Nexus checks take ~3 s and run alongside answers, so check after every new line (the loop
  # skips when nothing new was said) and jump in more often than the local defaults allow.
  interval_s: 4
  cooldown_s: 60            # between any two hands (default 180)
  type_cooldown_s:
    point: 90               # between two points (default 300)

llm:
  answer: &nexus
    backend: ollama
    model: qwen3.8:27b
    where: nexus
    host: http://127.0.0.1:11435
    num_ctx: 32768          # whole paper + brief + transcript; matches scripts/nexus_up.sh
    context: full_paper
    think: false            # live answers: no thinking, first words in ~2 s
    keep_alive: 24h
    concurrent: true        # the job serves 2 requests at once
    timeout_s: 30
    temperature: 0.2
    max_tokens: 200
    fallback:
      backend: groq
      model: qwen/qwen3.8-27b
      extra: {reasoning_effort: none}
      max_tokens: 200
      timeout_s: 20
      fallback:
        backend: groq
        model: openai/gpt-oss-120b
        extra: {reasoning_effort: low}
        max_tokens: 800
        timeout_s: 20
        fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 200}
  trigger:
    <<: *nexus
    temperature: 0.0
  interjection:             # prepared when the hand goes up, before Reveal: time to think
    <<: *nexus
    think: true
    max_tokens: 1500
    timeout_s: 60
  summary:                  # after the meeting: nobody is waiting, so think, in one pass
    <<: *nexus
    context: retrieval      # transcript + brief only (the whole paper would overflow 32k)
    think: true
    max_tokens: 6000          # thinking counts toward this; too low cuts the summary off
    timeout_s: 300
    summary_chars: 80000    # a whole meeting in one pass (~20k tokens)
    fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 400, summary_chars: 12000}
