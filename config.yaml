# Reading Group Assistant configuration. Every tunable lives here.
# CLI flags (e.g. --mode, --speed) override individual values at runtime.

assistant_name: Sherlock
# Extra spellings STT tends to produce for the name. Matched fuzzily.
name_aliases: [sherlock, sherlok, shirlock, sherlocke, sher lock, share lock, sure lock, shylock]
# Only look for the name in the first N words of a segment (or right after hey/ok/so).
name_search_words: 8
name_match_ratio: 80

# Names of group members, used to prime speech recognition. Put real names in the
# gitignored config.local.yaml, not here.
group_members: []

audio_device: "BlackHole 2ch"
mode: ask            # ask | engaged | discuss

stt:
  backend: faster-whisper   # faster-whisper | parakeet-mlx (Apple GPU, ~3x faster) | deepgram
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v2
  model: small.en           # base.en is the lighter fallback
  compute_type: int8
  cpu_threads: 4
  language: en
  beam_size: 1
  # live chunking
  sample_rate: 16000
  silence_s: 0.6            # cut a chunk after this much silence
  chunk_max_s: 10
  energy_threshold: 0.008   # RMS below this counts as silence (float audio, -1..1)
  silence_warn_s: 20        # live: warn if the input has been silent this long

llm:
  prep:
    backend: claude-cli
    model: opus             # strongest on the Claude Code login; prep runs once per paper
    timeout_s: 600
  answer:
    backend: ollama
    model: qwen2.5:7b
    num_ctx: 8192
    keep_alive: 30m
    temperature: 0.2
    max_tokens: 200
  # Optional, free, faster: answers on Groq's cloud API, falling back to local Ollama
  # if the key is missing, the API errors, or the free-tier limit is hit. This sends
  # the recent transcript to Groq, so get the group's OK first. Put it in the
  # gitignored config.local.yaml (and GROQ_API_KEY in .env) rather than here:
  #
  #   llm:
  #     answer:
  #       backend: groq
  #       model: qwen/qwen3.8-27b
  #       extra: {reasoning_effort: high, reasoning_format: hidden}  # thinking, kept off the display
  #       max_tokens: 1500       # must cover the thinking tokens too
  #       temperature: 0.2
  #       timeout_s: 20
  #       retry_after_s: 60      # after a failure, use the fallback this long
  #       fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m}
  #
  # Triggers stay local by default: they run ~4 times a minute with ~2-3k tokens
  # each, more than Groq's free ~8k tokens/minute allows.
  # Roles that share a model must use the same num_ctx, or Ollama reloads the
  # model whenever they alternate.
  trigger:
    backend: ollama
    model: qwen2.5:7b
    num_ctx: 8192
    keep_alive: 30m
    temperature: 0.0
    max_tokens: 200
  summary:
    backend: ollama
    model: qwen2.5:7b
    num_ctx: 8192
    keep_alive: 30m
    temperature: 0.2
    max_tokens: 400

# Choices offered by the control page (/control) for switching models mid-meeting.
# Cloud presets only appear when their API key is in .env; every model pulled into
# local Ollama is offered too. Cloud presets send the transcript to that provider.
model_presets:
  "Groq · Qwen3.8 27B, thinking":
    backend: groq
    model: qwen/qwen3.8-27b
    extra: {reasoning_effort: high, reasoning_format: hidden}
    max_tokens: 1500
    timeout_s: 20
    # thinking costs ~500 output tokens/answer against a 1000/min free limit, so fall
    # through to the same model without thinking, then another Groq model, then local
    fallback:                 # same model without thinking: ~60 output tokens instead of ~500
      backend: groq
      model: qwen/qwen3.8-27b
      extra: {reasoning_effort: none}
      max_tokens: 200
      timeout_s: 20
      fallback:               # a different Groq model has its own rate-limit bucket
        backend: groq
        model: openai/gpt-oss-120b
        extra: {reasoning_effort: low}
        max_tokens: 800
        timeout_s: 20
        fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 200}
  "Groq · Qwen3.8 27B, fast":
    backend: groq
    model: qwen/qwen3.8-27b
    extra: {reasoning_effort: none}
    max_tokens: 200
    timeout_s: 20
    fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 200}
  "Groq · gpt-oss-120b":
    backend: groq
    model: openai/gpt-oss-120b
    extra: {reasoning_effort: low}
    max_tokens: 1000
    timeout_s: 20
    fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 200}
  # Needs scripts/nexus_up.sh running (UMD VPN + Nexus GPU job + tunnel); see README.
  # If the tunnel drops, calls fail within timeout_s and fall through to Groq, then local.
  "Nexus · Qwen3.8 27B, whole paper":
    backend: ollama
    model: qwen3.8:27b        # the job's answers server (scripts/nexus_up.sh)
    host: http://127.0.0.1:11435
    num_ctx: 32768            # paper (~18k tokens) + brief + transcript; match RGA_NEXUS_NUM_CTX
    context: full_paper       # this model sees the whole paper; Groq/local fallbacks use excerpts
    think: false
    keep_alive: 24h
    concurrent: true          # the job serves 2 requests at once: answers don't wait for triggers
    timeout_s: 30
    max_tokens: 200
    fallback:
      backend: groq
      model: qwen/qwen3.8-27b
      extra: {reasoning_effort: none}
      max_tokens: 200
      timeout_s: 20
      fallback: {backend: ollama, model: qwen2.5:7b, num_ctx: 8192, keep_alive: 30m, max_tokens: 200}
  "Claude Sonnet via claude -p (slow, no streaming)":
    backend: claude-cli
    model: sonnet
    timeout_s: 60

# Spoken answers (Phase 6). Off by default; turn on here, with --set voice.mode=answers,
# or from the control page. The voice plays into output_device, which Zoom uses as the
# laptop's microphone (unmute the laptop in Zoom). Listening pauses while it speaks.
voice:
  mode: "answers+reveal"               # off | answers | answers+reveal (a raised hand is spoken only after Reveal)
  backend: kokoro           # kokoro (local) | say (macOS) | groq (Orpheus, cloud)
  engine: auto              # kokoro: auto (Apple GPU via MLX if available, else CPU) | mlx | onnx
  output_device: "BlackHole 16ch"   # "default" = laptop speakers, for testing
  voice: af_heart           # kokoro voice: af_heart, af_bella, am_michael, bf_emma, bm_george, ...
  speed: 1.0
  lang: en-us
  kokoro_dir: ~/.cache/kokoro-onnx  # model files download here on first use (~350 MB)
  kokoro_model: kokoro-v1.0.onnx
  say_voice: Samantha
  groq_voice: troy
  gain: 1.0
  echo_tail_s: 0.5          # keep listening paused this long after speech ends
  say_reference: false      # also speak "Earlier, someone said: ..." before a revealed hand
                            # (the display always shows the original words and time)

question_pause_s: 1.5
question_max_s: 30          # stop collecting a question after this long regardless

answer:
  # retrieval: brief + top-k paper chunks (fast on local 7B models)
  # full_paper: brief + entire paper text (for large-context cloud models)
  context: retrieval
  max_sentences: 3
  transcript_window_s: 45
  retrieval_k: 3
  chunk_chars: 450
  chunk_overlap: 120        # chars repeated from the previous chunk

trigger:
  interval_s: 15
  window_s: 120
  thresholds:
    contradiction: 0.7
    gap: 0.7
    point: 0.8              # discuss mode only; stricter: an extra point is optional
  cooldown_s: 180           # between any two hands
  type_cooldown_s:
    point: 300              # and at least this long between two points
  point_recent_s: 60        # a point must quote something said in the last N seconds
  notes_interval_s: 60      # update the running meeting notes this often (0 = off)
  notes_max_words: 250
  notes_max_tokens: 900
  expire_s:                 # lower a hand nobody revealed after N seconds (0 = never)
    point: 120
    gap: 240
    contradiction: 0
  dedup_ratio: 70
  context_s: 45             # transcript context around each logged entry

display:
  host: 127.0.0.1
  port: 8765
  transcript: "on"          # live transcript panel on the display (collapsed by default); "off" = never sent
  share: false              # --share: public link to the display (secret key in the URL), for the Zoom chat
  share_method: auto        # auto = cloudflared (downloaded to ~/.cache/rga on first use) | localhost.run

prep:
  max_words: 900          # brief length limit (about 2 pages)

related:
  max_refs: 8
  max_citing: 8

paths:
  prompts_dir: prompts
  meetings_dir: meetings
  briefs_dir: briefs
  cache_dir: meetings/.cache
