name: rga
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - portaudio      # needed for live audio capture
  - ffmpeg         # audio decoding for whisper and replay
  - pip:
      - faster-whisper
      - sounddevice
      - fastapi
      - uvicorn
      - pyyaml
      - python-dotenv
      - pypdf
      - requests
      - ollama
      - pytest
      - rapidfuzz
      - websockets
      - kokoro-onnx    # local neural TTS for spoken answers (voice output)
      - mlx-audio      # same Kokoro voice on the Apple GPU (much lower latency on M-series Macs)
      - misaki[en]     # Kokoro's text-to-phoneme frontend, needed by mlx-audio
      - en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl  # misaki would otherwise pip-install it at runtime
